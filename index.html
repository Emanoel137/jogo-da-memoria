<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Jogo da Memória Fofinho - 80 Cartas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffd1dc 0%, #ffc8dd 25%, #bde0fe 60%, #a2d2ff 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Nuvens decorativas de fundo */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      top: -100px; left: -100px;
    }
    body::after {
      width: 500px; height: 500px;
      bottom: -150px; right: -150px;
    }

    /* Corações flutuantes */
    .coracao {
      position: fixed;
      font-size: 1.5rem;
      opacity: 0.4;
      pointer-events: none;
      animation: flutuar 6s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes flutuar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-25px) rotate(15deg); }
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(90deg, #ff6fa5, #ff8fab, #c58bf2, #7cb3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 3px 3px 0 rgba(255,255,255,0.7);
      margin-bottom: 4px;
      font-size: 2.8rem;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitulo {
      color: #b0508b;
      margin-bottom: 22px;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      background: rgba(255,255,255,0.6);
      padding: 6px 22px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 111, 165, 0.2);
      border: 2px dashed #ffb3d1;
    }

    .painel {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      position: sticky;
      top: 12px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      padding: 12px 22px;
      border-radius: 50px;
      border: 3px solid #fff;
      box-shadow: 0 8px 25px rgba(197, 139, 242, 0.3);
    }

    .info {
      background: linear-gradient(135deg, #ffd1e6, #ffb3d9);
      color: #a03d6e;
      padding: 9px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(255, 111, 165, 0.25);
      white-space: nowrap;
      font-family: 'Fredoka', sans-serif;
    }

    .info span {
      color: #d6336c;
    }

    button {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #ffd166, #ffb703);
      color: #7a4a00;
      border: 2px solid #fff;
      padding: 9px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 5px 15px rgba(255, 183, 3, 0.4);
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 22px rgba(255, 183, 3, 0.6);
      background: linear-gradient(135deg, #ffe08a, #ffc233);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Tabuleiro com cartas grandes: 10 colunas, cartas maiores */
    .tabuleiro {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px;
      max-width: 1400px;
      width: 100%;
      perspective: 1200px;
    }

    .carta {
      aspect-ratio: 1 / 1;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .carta:hover:not(.virada):not(.encontrada) {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 10px 22px rgba(197, 139, 242, 0.4);
    }

    .carta.virada {
      transform: rotateY(180deg);
    }

    .carta .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: 2.4rem;
      user-select: none;
    }

    /* FRENTE — colorida com degradê */
    .carta .frente {
      transform: rotateY(180deg);
      border: 3px solid #fff;
      background: linear-gradient(145deg, var(--cor-clara), var(--cor));
      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.5),
        0 0 0 3px rgba(255,255,255,0.4);
      position: relative;
      overflow: hidden;
    }

    /* Brilhinho no canto */
    .carta .frente::before {
      content: "✨";
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 0.7rem;
      opacity: 0.9;
      animation: brilhar 2s ease-in-out infinite;
    }
    @keyframes brilhar {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.2); }
    }

    /* VERSO — fofinho com padrão */
    .carta .verso {
      background:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,0.25) 0%, transparent 40%),
        radial-gradient(circle at 75% 75%, rgba(255,255,255,0.25) 0%, transparent 40%),
        linear-gradient(145deg, #ff8fc7, #c58bf2 55%, #7cb3ff);
      border: 3px solid #fff;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.35);
      position: relative;
    }

    .carta .verso::after {
      content: "🐾";
      font-size: 1.8rem;
      opacity: 0.9;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      animation: balancar 3s ease-in-out infinite;
    }
    @keyframes balancar {
      0%, 100% { transform: rotate(-8deg); }
      50%      { transform: rotate(8deg); }
    }

    .carta.encontrada .frente {
      border: 4px solid #fff;
      box-shadow:
        0 0 25px rgba(255,255,255,1),
        0 0 40px var(--cor),
        inset 0 0 25px rgba(255,255,255,0.8);
      animation: pulse 0.8s ease;
    }

    .carta.encontrada {
      cursor: default;
    }

    /* Coraçãozinho ao encontrar par */
    .carta.encontrada::after {
      content: "💖";
      position: absolute;
      top: -8px;
      right: -8px;
      font-size: 1.3rem;
      animation: pop 0.6s ease;
      z-index: 5;
    }
    @keyframes pop {
      0%   { transform: scale(0); }
      70%  { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    @keyframes pulse {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.15); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .tabuleiro.bloqueado .carta:not(.encontrada) {
      pointer-events: none;
    }

    /* Tela de vitória fofinha */
    .vitoria {
      text-align: center;
      color: #a03d6e;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 35px 50px;
      border-radius: 32px;
      border: 4px dashed #ffb3d1;
      margin-top: 30px;
      box-shadow: 0 15px 40px rgba(197, 139, 242, 0.4);
      animation: aparecer 0.6s ease;
    }

    .vitoria h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ff6fa5, #c58bf2, #7cb3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .vitoria p {
      font-size: 1.15rem;
      margin-bottom: 20px;
      font-weight: 700;
      color: #b0508b;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(30px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .escondido {
      display: none !important;
    }

    /* Rodapé fofinho */
    .rodape {
      margin-top: 30px;
      color: #b0508b;
      font-weight: 700;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.6);
      padding: 8px 22px;
      border-radius: 30px;
      border: 2px dashed #ffb3d1;
      position: relative;
      z-index: 2;
    }

    /* Responsividade */
    @media (max-width: 1200px) {
      .tabuleiro { grid-template-columns: repeat(8, 1fr); gap: 10px; }
      .carta .face { font-size: 2.1rem; }
    }

    @media (max-width: 900px) {
      .tabuleiro { grid-template-columns: repeat(6, 1fr); gap: 9px; }
      .carta .face { font-size: 1.9rem; }
      h1 { font-size: 2.2rem; }
    }

    @media (max-width: 600px) {
      .tabuleiro { grid-template-columns: repeat(5, 1fr); gap: 7px; }
      .carta .face { font-size: 1.6rem; }
      .carta .verso::after { font-size: 1.2rem; }
      h1 { font-size: 1.7rem; }
      .subtitulo { font-size: 0.9rem; }
      .info, button { font-size: 0.85rem; padding: 7px 14px; }
    }

    @media (max-width: 400px) {
      .tabuleiro { grid-template-columns: repeat(4, 1fr); gap: 5px; }
      .carta .face { font-size: 1.3rem; }
      .carta .verso::after { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Corações flutuantes decorativos -->
  <div class="coracao" style="top: 10%; left: 5%;  animation-delay: 0s;">💖</div>
  <div class="coracao" style="top: 25%; right: 6%; animation-delay: 1s;">🌸</div>
  <div class="coracao" style="top: 60%; left: 3%;  animation-delay: 2s;">✨</div>
  <div class="coracao" style="top: 75%; right: 4%; animation-delay: 1.5s;">💕</div>
  <div class="coracao" style="top: 45%; left: 8%;  animation-delay: 3s;">⭐</div>
  <div class="coracao" style="top: 85%; left: 12%; animation-delay: 2.5s;">🌈</div>

  <div class="container">
    <h1>🌸 Jogo da Memória Fofinho 🌸</h1>
    <p class="subtitulo">💖 Encontre os 40 pares entre 80 cartinhas! 💖</p>

    <div class="painel">
      <div class="info">🎯 Jogadas: <span id="jogadas">0</span></div>
      <div class="info">💝 Pares: <span id="pares">0</span> / 40</div>
      <button id="reiniciar">🔄 Reiniciar</button>
    </div>

    <div class="tabuleiro" id="tabuleiro"></div>

    <div class="vitoria escondido" id="vitoria">
      <h2>🎉 Parabéns! 🎉</h2>
      <p>Você encontrou todos os 40 pares em <strong id="totalJogadas">0</strong> jogadas! 💖</p>
      <button id="jogarNovamente">🌈 Jogar Novamente</button>
    </div>

    <div class="rodape">💕 Feito com carinho • 80 cartas • 40 pares 💕</div>
  </div>

  <script>
    (function() {
      // 40 animais com 40 cores diferentes!
      const ANIMAIS = [
        { emoji: '🐶', nome: 'Cachorro',   cor: '#ff8fa3', corClara: '#ffd6e0' },
        { emoji: '🐱', nome: 'Gato',       cor: '#ff6fa5', corClara: '#ffc2dd' },
        { emoji: '🦊', nome: 'Raposa',     cor: '#ff9f68', corClara: '#ffd9b8' },
        { emoji: '🐼', nome: 'Panda',      cor: '#a8b8c8', corClara: '#dde7f0' },
        { emoji: '🦁', nome: 'Leão',       cor: '#ffb84d', corClara: '#ffe4b5' },
        { emoji: '🐸', nome: 'Sapo',       cor: '#7fd88f', corClara: '#c8f0cf' },
        { emoji: '🐵', nome: 'Macaco',     cor: '#c09b7a', corClara: '#e8d5c4' },
        { emoji: '🦉', nome: 'Coruja',     cor: '#b391e8', corClara: '#e0d3f7' },
        { emoji: '🐯', nome: 'Tigre',      cor: '#ffa726', corClara: '#ffe0b2' },
        { emoji: '🐨', nome: 'Coala',      cor: '#c2ced6', corClara: '#eef3f6' },
        { emoji: '🐷', nome: 'Porco',      cor: '#ffb3d1', corClara: '#ffe0ec' },
        { emoji: '🐔', nome: 'Galinha',    cor: '#ffe066', corClara: '#fff6cc' },
        { emoji: '🐮', nome: 'Vaca',       cor: '#d9c2b0', corClara: '#f2e6da' },
        { emoji: '🐴', nome: 'Cavalo',     cor: '#b8917a', corClara: '#e0cbb8' },
        { emoji: '🐑', nome: 'Ovelha',     cor: '#e8e8e8', corClara: '#fafafa' },
        { emoji: '🐘', nome: 'Elefante',   cor: '#b0b8c0', corClara: '#e0e6ea' },
        { emoji: '🦒', nome: 'Girafa',     cor: '#ffd68f', corClara: '#ffefcc' },
        { emoji: '🦓', nome: 'Zebra',      cor: '#8fa3b8', corClara: '#d4dfe9' },
        { emoji: '🐻', nome: 'Urso',       cor: '#a87b5c', corClara: '#d9bfa8' },
        { emoji: '🐰', nome: 'Coelho',     cor: '#ffc2dd', corClara: '#ffe6f0' },
        { emoji: '🐭', nome: 'Rato',       cor: '#c8c8c8', corClara: '#ececec' },
        { emoji: '🐹', nome: 'Hamster',    cor: '#ffb0a0', corClara: '#ffd9d1' },
        { emoji: '🐺', nome: 'Lobo',       cor: '#7a94a8', corClara: '#c4d2dc' },
        { emoji: '🦝', nome: 'Guaxinim',   cor: '#b8a89a', corClara: '#e0d5cb' },
        { emoji: '🦔', nome: 'Ouriço',     cor: '#a0846c', corClara: '#d1bba8' },
        { emoji: '🐢', nome: 'Tartaruga',  cor: '#7ed492', corClara: '#c8f0d1' },
        { emoji: '🐍', nome: 'Cobra',      cor: '#a8d86a', corClara: '#ddefc4' },
        { emoji: '🦎', nome: 'Lagarto',    cor: '#bfe08c', corClara: '#e3f2c8' },
        { emoji: '🐙', nome: 'Polvo',      cor: '#ff7a7a', corClara: '#ffc9c9' },
        { emoji: '🦀', nome: 'Caranguejo', cor: '#ff5a5a', corClara: '#ffbcbc' },
        { emoji: '🐠', nome: 'Peixe',      cor: '#68c8f0', corClara: '#c2e8f8' },
        { emoji: '🐬', nome: 'Golfinho',   cor: '#4ab0ee', corClara: '#b8dcf7' },
        { emoji: '🐳', nome: 'Baleia',     cor: '#5a9aee', corClara: '#c2d8f8' },
        { emoji: '🦈', nome: 'Tubarão',    cor: '#7a8ee0', corClara: '#ccd3f5' },
        { emoji: '🦋', nome: 'Borboleta',  cor: '#cc8ae0', corClara: '#eaccf5' },
        { emoji: '🐝', nome: 'Abelha',     cor: '#ffcf40', corClara: '#ffefb8' },
        { emoji: '🐞', nome: 'Joaninha',   cor: '#f06060', corClara: '#ffc2c2' },
        { emoji: '🦜', nome: 'Papagaio',   cor: '#4acfa0', corClara: '#bdeed9' },
        { emoji: '🐧', nome: 'Pinguim',    cor: '#6aa8d8', corClara: '#c2dcf0' },
        { emoji: '🦩', nome: 'Flamingo',   cor: '#ff9fc8', corClara: '#ffd6e8' }
      ];

      const tabuleiro = document.getElementById('tabuleiro');
      const jogadasEl = document.getElementById('jogadas');
      const paresEl = document.getElementById('pares');
      const vitoriaEl = document.getElementById('vitoria');
      const totalJogadasEl = document.getElementById('totalJogadas');
      const btnReiniciar = document.getElementById('reiniciar');
      const btnJogarNovamente = document.getElementById('jogarNovamente');

      let primeiraCarta = null;
      let segundaCarta = null;
      let bloqueado = false;
      let jogadas = 0;
      let paresEncontrados = 0;
      const totalPares = ANIMAIS.length; // 40

      paresEl.textContent = '0';

      function embaralhar(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function criarBaralho() {
        const baralho = [];
        ANIMAIS.forEach((animal, index) => {
          baralho.push({ ...animal, idPar: index });
          baralho.push({ ...animal, idPar: index });
        });
        return embaralhar(baralho);
      }

      function renderizar() {
        tabuleiro.innerHTML = '';
        const baralho = criarBaralho();

        baralho.forEach((carta) => {
          const div = document.createElement('div');
          div.classList.add('carta');
          div.dataset.idPar = carta.idPar;
          div.dataset.emoji = carta.emoji;
          div.dataset.nome = carta.nome;
          div.setAttribute('aria-label', 'Carta virada para baixo');

          div.style.setProperty('--cor', carta.cor);
          div.style.setProperty('--cor-clara', carta.corClara);

          div.innerHTML = `
            <div class="face frente">${carta.emoji}</div>
            <div class="face verso"></div>
          `;

          div.addEventListener('click', () => virarCarta(div));
          tabuleiro.appendChild(div);
        });
      }

      function virarCarta(carta) {
        if (bloqueado) return;
        if (carta.classList.contains('virada')) return;
        if (carta.classList.contains('encontrada')) return;

        carta.classList.add('virada');
        carta.setAttribute('aria-label', `Carta do ${carta.dataset.nome}`);

        if (!primeiraCarta) {
          primeiraCarta = carta;
          return;
        }

        segundaCarta = carta;
        bloqueado = true;
        jogadas++;
        jogadasEl.textContent = jogadas;

        verificarPar();
      }

      function verificarPar() {
        const id1 = primeiraCarta.dataset.idPar;
        const id2 = segundaCarta.dataset.idPar;

        if (id1 === id2) {
          setTimeout(() => {
            primeiraCarta.classList.add('encontrada');
            segundaCarta.classList.add('encontrada');
            paresEncontrados++;
            paresEl.textContent = paresEncontrados;

            resetarSelecao();

            if (paresEncontrados === totalPares) {
              finalizarJogo();
            }
          }, 350);
        } else {
          setTimeout(() => {
            primeiraCarta.classList.remove('virada');
            segundaCarta.classList.remove('virada');
            primeiraCarta.setAttribute('aria-label', 'Carta virada para baixo');
            segundaCarta.setAttribute('aria-label', 'Carta virada para baixo');
            resetarSelecao();
          }, 850);
        }
      }

      function resetarSelecao() {
        primeiraCarta = null;
        segundaCarta = null;
        bloqueado = false;
      }

      function finalizarJogo() {
        totalJogadasEl.textContent = jogadas;
        vitoriaEl.classList.remove('escondido');
        vitoriaEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function reiniciarJogo() {
        primeiraCarta = null;
        segundaCarta = null;
        bloqueado = false;
        jogadas = 0;
        paresEncontrados = 0;
        jogadasEl.textContent = '0';
        paresEl.textContent = '0';
        vitoriaEl.classList.add('escondido');
        renderizar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      btnReiniciar.addEventListener('click', reiniciarJogo);
      btnJogarNovamente.addEventListener('click', reiniciarJogo);

      renderizar();
    })();
  </script>
</body>
</html>
